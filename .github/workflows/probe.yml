name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Probe
        run: |
          set +e
          mkdir p && cd p
          curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o manifest.json
          url=$(python3 -c "import json;m=json.load(open('manifest.json'));print([v['url'] for v in m['versions'] if v['id']=='26.2'][0])")
          curl -s $url -o v.json
          curl -s $(python3 -c "import json;print(json.load(open('v.json'))['downloads']['client']['url'])") -o client.jar
          mkdir c && (cd c && unzip -q ../client.jar)
          echo "=== ATTR NAMES"; strings -n 6 c/net/minecraft/world/attribute/EnvironmentAttributes.class | grep -E '^(visual|gameplay|audio)/' | tr '\n' ' '; echo
          echo "=== MODIFIERS"; ls c/net/minecraft/world/attribute/modifier/; strings c/net/minecraft/world/attribute/modifier/AttributeModifier.class | grep -E '^[a-z_]+$' | tr '\n' ' '; echo
          echo "=== TIMELINE TAGS"; ls c/data/minecraft/tags/timeline/; for f in c/data/minecraft/tags/timeline/*.json; do echo $f; cat $f; done
          echo "=== MOON"; cat c/data/minecraft/timeline/moon.json
          echo "=== EARLY"; cat c/data/minecraft/timeline/early_game.json | head -c 2500
          echo "=== DAY rest"; python3 -c "import json;d=json.load(open('c/data/minecraft/timeline/day.json'));print(list(d['tracks'].keys()));[print(k,json.dumps(d['tracks'][k])) for k in d['tracks'] if k.startswith('minecraft:visual')]"
          echo "=== WORLD CLOCK"; ls c/data/minecraft/world_clock; cat c/data/minecraft/world_clock/*.json
          curl -sL https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar -o vf.jar
          mkdir d
          for k in $(cd c && find net/minecraft/world/timeline -name '*.class' | grep -v '\$' | sed 's/.class$//'); do java -jar vf.jar c/$k.class d/ >/dev/null 2>&1; done
          ls d; for f in d/Timeline.java d/Track.java d/Keyframe*.java d/AttributeTrack.java; do echo "=== $f"; head -c 5000 $f; done
          java -jar vf.jar c/net/minecraft/client/renderer/SkyRenderer.class d2/ >/dev/null 2>&1
          echo "=== SKY ATTR USE"; grep -n -E "EnvironmentAttributes\.[A-Z_]+" -o d2/SkyRenderer.java | sort -u
          ls c/net/minecraft/client/renderer/state/level/ ; java -jar vf.jar c/net/minecraft/client/renderer/state/level/SkyRenderState.class d3/ >/dev/null 2>&1; cat d3/*.java | head -60
          grep -rl "SkyRenderState" c/net/minecraft/client/renderer/*.class | head
          java -jar vf.jar c/net/minecraft/client/renderer/LevelRenderer.class d4/ >/dev/null 2>&1; grep -n -B3 -A30 "void extractSky\|SkyRenderState skyState\|extractRenderState(.*Sky" d4/LevelRenderer.java | head -80
          java -jar vf.jar c/net/minecraft/client/renderer/SkyRenderer.class d2/ >/dev/null 2>&1; grep -n -A40 "public void extractRenderState" d2/SkyRenderer.java | head -70
          grep -n -A40 "public void renderSunMoonAndStars\|void renderSun\|void renderMoon" d2/SkyRenderer.java | head -120
